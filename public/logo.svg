  <!-- Academic Tassel in #F9870D -->
  <path d="M72 36 L82 46 L82 56" stroke="#F9870D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="82" cy="58" r="2" fill="#F9870D" />
