<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer Dark/Black Circular Container -->
  <rect width="100" height="100" rx="24" fill="#000000" />
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="#F9870D" stroke-width="2.5" stroke-opacity="0.8" />
  
  <!-- Subtle Orange Glow Center -->
  <circle cx="50" cy="50" r="32" fill="#F9870D" fill-opacity="0.12" />

  <!-- Iconic Grade 'A' + Mortarboard / Apex Crest -->
  <!-- Upper Diamond / Mortarboard in Brand Orange #F9870D -->
  <path d="M50 18 L76 33 L50 48 L24 33 Z" fill="#F9870D" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" />
  
  <!-- Modern Geometric Grade 'A' Legs in Crisp White #FFFFFF -->
  <path d="M34 50 L26 78" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  <path d="M66 50 L74 78" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  
  <!-- Crossbar with Orange Star / Sparkle in #F9870D -->
